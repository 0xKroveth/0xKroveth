<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 178" width="900" height="178" role="img" aria-label="0xKroveth">
<style>
.bg{fill:#07080b}
.bit{font:600 12px 'Fira Code','JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace;fill:#ff0033;opacity:0;animation:twinkle 6s linear infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.22}}
.sh{fill:#4d0010}
.main{fill:#f4f4f5;animation:flick 7s steps(1) infinite}
.r{fill:#ff0033;mix-blend-mode:screen;animation:gr 3.5s steps(1) infinite}
.c{fill:#00ff66;mix-blend-mode:screen;animation:gc 3.5s steps(1) infinite}
.slice{fill:#ffffff;animation:sl 3.5s steps(1) infinite}
@keyframes gr{0%,80%,100%{transform:translate(0,0);opacity:0}82%{transform:translate(-6px,1px);opacity:.9}86%{transform:translate(4px,-2px);opacity:.9}90%{transform:translate(-3px,0);opacity:.9}94%{transform:translate(0,0);opacity:0}}
@keyframes gc{0%,80%,100%{transform:translate(0,0);opacity:0}82%{transform:translate(6px,-1px);opacity:.9}86%{transform:translate(-4px,2px);opacity:.9}90%{transform:translate(3px,0);opacity:.9}94%{transform:translate(0,0);opacity:0}}
@keyframes sl{0%,83%,100%{transform:translateX(0);opacity:0}84%{transform:translateX(18px);opacity:1}87%{transform:translateX(-12px);opacity:1}89%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}61%{opacity:.55}62%{opacity:1}}
.scan{fill:url(#lines)}
.beam{fill:url(#beam);animation:beam 4s linear infinite}
@keyframes beam{from{transform:translateY(-60px)}to{transform:translateY(178px)}}
.sub{font:600 17px 'Fira Code','JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace;fill:#c9d1d9;letter-spacing:1px}
.acc{fill:#ff0033}.ok{fill:#00ff66}
.cur{fill:#00ff66;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.type{clip-path:inset(0 100% 0 0);animation:type 9s steps(44) infinite}
@keyframes type{0%{clip-path:inset(0 100% 0 0)}35%,90%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
</style>
