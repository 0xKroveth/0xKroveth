<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 170" width="440" height="170" role="img" aria-label="Ver todos los repositorios"><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SFMono-Regular','DejaVu Sans Mono',Consolas,monospace}
